<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#25145a"><title>Personvognsteknik Duel 2.0</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#160d38}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#653bd4 0,#28135d 45%,#160d38 85%);min-height:100vh}main{max-width:560px;margin:auto;padding:22px 18px 70px}.brand{display:flex;align-items:center;gap:12px}.logo{font-size:30px;background:#fff2;border-radius:16px;padding:12px}.small{color:#cbbdf2;font-size:13px}.title{font-size:30px;font-weight:900;line-height:1.12;margin:3px 0}.hero{padding:22px;border-radius:26px;background:linear-gradient(135deg,#7950f2,#3b1d91);box-shadow:0 14px 40px #08032255;margin:24px 0}.hero h2{font-size:25px;margin:0 0 9px}.hero p{color:#eee4ff;margin:0 0 18px}.btn{border:0;border-radius:15px;background:#ffc84c;color:#29134b;padding:14px 18px;font-weight:850;font-size:16px;cursor:pointer}.btn:disabled{opacity:.5}.btn.secondary{background:#ffffff1c;color:#fff;border:1px solid #ffffff30}.btn.block{width:100%;margin-top:10px}.card{background:#ffffff12;border:1px solid #ffffff1e;border-radius:22px;padding:19px;margin:12px 0;box-shadow:0 8px 24px #0002}.card h3{margin:0 0 10px}.pill{display:inline-block;background:#ffd15c;color:#321b5e;border-radius:30px;padding:5px 10px;font-size:12px;font-weight:800}.muted{color:#cbbdf2}.field{display:block;width:100%;background:#fff;color:#20133d;border:0;border-radius:14px;padding:14px;font-size:17px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.duel{cursor:pointer}.duel:active{transform:scale(.99)}.avatar{width:45px;height:45px;display:grid;place-items:center;background:#a889ff;border-radius:50%;font-size:23px}.bar{height:9px;background:#ffffff29;border-radius:20px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:#ffd15c}.answer{width:100%;text-align:left;background:#ffffff17;border:1px solid #ffffff30;color:white;padding:17px;margin:7px 0;border-radius:15px;font-size:16px}.answer:disabled{opacity:.6}.score{font-size:28px;font-weight:900}.notice{padding:13px;background:#39206e;border-radius:14px;margin:14px 0}.error{color:#ffc6c6;min-height:22px}.nav{margin:20px 0}.center{text-align:center}h2{margin:8px 0 16px}button{font-family:inherit}footer{color:#9e8acb;text-align:center;font-size:12px;margin-top:28px}
</style></head><body><main><div class="brand"><div class="logo">🔧</div><div><div class="small">AUTOQUIZ • 2 SPILLERE</div><div class="title">PERSONVOGNS<br>DUEL <span style="color:#ffcf53">2.0</span></div></div></div><p id="message" class="error"></p><div id="screen"><div class="card">Indlæser spillet …</div></div><footer>Spil på skift • Gem adressen på din hjemmeskærm</footer></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,collection,query,where,limit,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyCla_rNEnK9UTQ5kNTVmVlOlORD71JjI1A",authDomain:"auto-quiz-9f924.firebaseapp.com",projectId:"auto-quiz-9f924",storageBucket:"auto-quiz-9f924.firebasestorage.app",messagingSenderId:"673795261314",appId:"1:673795261314:web:d89d4327aa8038d5bac59b",measurementId:"G-J5KN97WVMX"};
const screen=document.querySelector('#screen'),message=document.querySelector('#message');let db,uid,questions=[],active=null,stopList=null,stopMatch=null,player=localStorage.getItem('pv2_name')||'',matches=[];const e=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const msg=s=>message.textContent=s||'';const code=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');
function home(){active=null;if(stopMatch){stopMatch();stopMatch=null}msg('');screen.innerHTML=`<div class="hero"><span class="pill">🏆 QUIZDUEL</span><h2>Udfordr en ven!</h2><p>Tag din tur nu. Din modstander kan svare senere.</p><button class="btn" id="new">+ Start ny duel</button></div><div class="card"><h3>👤 Dit spillernavn</h3><input class="field" id="name" maxlength="30" placeholder="Skriv dit navn" value="${e(player)}"><button class="btn secondary block" id="save">Gem navn</button></div><div class="card"><h3>🔑 Deltag i duel</h3><input class="field" id="joincode" maxlength="6" placeholder="6-tegns rumkode"><button class="btn secondary block" id="join">Deltag</button></div><h2>⚡ Mine dueller</h2><div id="duellist" class="muted">Henter dine dueller …</div>`;document.querySelector('#save').onclick=saveName;document.querySelector('#new').onclick=create;document.querySelector('#join').onclick=join;renderList()}
function saveName(){const n=document.querySelector('#name').value.trim().slice(0,30);if(!n){msg('Skriv et spillernavn.');return false}player=n;localStorage.setItem('pv2_name',n);msg('Navnet er gemt.');return true}
function renderList(){const el=document.querySelector('#duellist');if(!el)return;el.innerHTML=matches.length?matches.map((m,i)=>{let other=m.host===uid?m.guest:m.host;let label=m.names?.[other]||'Venter på modstander';let mine=m.turn===uid&&m.guest;return `<div class="card duel" data-i="${i}"><div class="row"><div class="row"><div class="avatar">🚗</div><div><strong>${e(label)}</strong><div class="small">${e(m.id)} • Runde ${m.round+1}</div></div></div><span class="pill">${m.winner?'Færdig':!m.guest?'Afventer':mine?'DIN TUR':'Venter'}</span></div><div class="small" style="margin-top:12px">${e(m.names?.[m.host]||'Vært')} ${m.scores?.[m.host]||0} – ${m.scores?.[m.guest]||0} ${e(m.names?.[m.guest]||'Gæst')}</div></div>`}).join(''):'<div class="card">Ingen dueller endnu. Start en ny duel eller indtast en rumkode.</div>';el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>watch(matches[Number(b.dataset.i)].id))}
async function create(){if(!saveName())return;try{msg('Opretter duel …');let id=code();const ref=doc(db,'matches',id);if((await getDoc(ref)).exists())throw Error('Prøv igen.');await setDoc(ref,{host:uid,guest:null,participants:[uid],names:{[uid]:player},scores:{[uid]:0},round:0,turn:uid,answers:{},winner:null,createdAt:Date.now()});watch(id)}catch(err){msg('Kunne ikke oprette duel: '+err.message)}}
async function join(){if(!saveName())return;try{const id=document.querySelector('#joincode').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(id))throw Error('Skriv en rumkode på 6 tegn.');const ref=doc(db,'matches',id);await runTransaction(db,async tx=>{const s=await tx.get(ref);if(!s.exists())throw Error('Rummet findes ikke.');const d=s.data();if(d.host===uid||d.guest===uid)return;if(d.guest)throw Error('Rummet har allerede to spillere.');tx.update(ref,{guest:uid,participants:[d.host,uid],[`names.${uid}`]:player,[`scores.${uid}`]:0,turn:d.host})});watch(id)}catch(err){msg('Kunne ikke deltage: '+err.message)}}
function watch(id){active=id;msg('');if(stopMatch)stopMatch();stopMatch=onSnapshot(doc(db,'matches',id),s=>{if(!s.exists()){msg('Duellen findes ikke.');home();return}renderMatch(s.data(),id)},err=>msg('Kunne ikke hente duel: '+err.message))}
function renderMatch(m,id){let other=m.host===uid?m.guest:m.host;let names=m.names||{};let q=questions[m.round%questions.length];let ready=!!m.guest,turn=m.turn===uid;let mine=m.answers?.[uid];let over=m.round>=questions.length;let html=`<div class="nav"><button class="btn secondary" id="back">← Mine dueller</button></div><div class="card"><div class="row"><span class="pill">RUM ${e(id)}</span><span class="small">Runde ${Math.min(m.round+1,questions.length)} af ${questions.length}</span></div><div class="row" style="margin-top:15px"><div><div class="small">${e(names[uid]||player)}</div><div class="score">${m.scores?.[uid]||0}</div></div><div class="avatar">⚔️</div><div style="text-align:right"><div class="small">${e(names[other]||'Modstander')}</div><div class="score">${m.scores?.[other]||0}</div></div></div><div class="bar"><span style="width:${Math.min(100,100*m.round/questions.length)}%"></span></div></div>`;
if(!ready)html+=`<div class="hero"><h2>Venter på spiller 2 👋</h2><p>Send denne rumkode til din modstander én gang. Begge kan bruge samme faste spiladresse.</p><div class="score center">${e(id)}</div><button class="btn block" id="copy">Kopiér invitation</button></div>`;
else if(over)html+=`<div class="hero center"><h2>🏆 Duel afsluttet!</h2><p>${m.scores?.[uid]===m.scores?.[other]?'Det blev uafgjort!':(m.scores?.[uid]||0)>(m.scores?.[other]||0)?'Du vandt!':'Din modstander vandt!'}</p><button class="btn" id="again">Start ny duel</button></div>`;
else if(!turn)html+=`<div class="hero center"><h2>⏳ Venter på ${e(names[other]||'modstanderen')}</h2><p>Du kan lukke spillet og komme tilbage senere. Din duel bliver gemt.</p></div>`;
else if(q){html+=`<div class="card"><span class="pill">🚘 SPØRGSMÅL ${m.round+1}</span><h2>${e(q.question)}</h2>${q.answers.map((a,i)=>`<button class="answer" data-answer="${i}">${String.fromCharCode(65+i)}. ${e(a)}</button>`).join('')}<div class="small">Vælg ét svar. Du får 1 point for et rigtigt svar.</div></div>`}else html+='<div class="card">Ingen spørgsmål fundet.</div>';
screen.innerHTML=html;document.querySelector('#back').onclick=home;document.querySelector('#copy')?.addEventListener('click',()=>navigator.clipboard.writeText('Spil Personvognsteknik Duel med mig: https://aljozbc-beep.github.io/Allan/ – rumkode '+id).then(()=>msg('Invitation kopieret.')).catch(()=>msg('Kopiér rumkoden: '+id)));document.querySelector('#again')?.addEventListener('click',()=>{home();document.querySelector('#new').click()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(id,m,Number(b.dataset.answer)))}
async function answer(id,m,n){const q=questions[m.round%questions.length];if(!q||m.turn!==uid||!m.guest)return;document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);try{await runTransaction(db,async tx=>{const ref=doc(db,'matches',id),s=await tx.get(ref);if(!s.exists())throw Error('Duellen findes ikke.');const d=s.data();if(d.turn!==uid||d.round!==m.round)throw Error('Turen er allerede spillet.');let next=d.host===uid?d.guest:d.host;let score=(d.scores?.[uid]||0)+(q.correct.includes(n)?1:0);tx.update(ref,{[`scores.${uid}`]:score,[`answers.${uid}`]:n,round:d.round+1,turn:next})});msg(q.correct.includes(n)?'✓ Rigtigt svar! 1 point.':'Svaret er registreret. Næste tur er modstanderens.')}catch(err){msg('Kunne ikke gemme svar: '+err.message)}}
async function boot(){try{const r=await fetch('./questions.json');if(!r.ok)throw Error('Spørgsmål kunne ikke hentes');questions=await r.json();if(!Array.isArray(questions)||!questions.length)throw Error('Spørgsmålslisten er tom');db=getFirestore(initializeApp(firebaseConfig));const auth=getAuth();const u=await signInAnonymously(auth);uid=u.user.uid;const q=query(collection(db,'matches'),where('participants','array-contains',uid),limit(100));stopList=onSnapshot(q,s=>{matches=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>b.createdAt-a.createdAt);renderList()},err=>msg('Kunne ikke hente dueller: '+err.message));home()}catch(err){msg('Kunne ikke starte: '+err.message);screen.innerHTML='<div class="card">Kontrollér internetforbindelse og Firebase-opsætning.</div>'}}boot();
</script></body></html>
